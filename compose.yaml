services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION}
    working_dir: /workspace
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
    ports:
      - "3000:3000"
    tty: true
    stdin_open: true

  postgres:
    image: postgres:17-bookworm
    profiles:
      - db
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  node_modules:
  postgres_data: